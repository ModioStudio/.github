# .github/workflows/metrics.yml
name: Org Metrics
on:
  workflow_dispatch:
    inputs:
      target:
        description: Select which image to build
        required: true
        default: run
        type: choice
        options:
          - run
          - run2
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: profile/metrics.svg
          token: ${{ secrets.METRICS_TOKEN }} # fine-grained: read:org, read:public_repo
          user: ModioStudio
          template: classic
          base: header, repositories
          config_timezone: Europe/Berlin
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update org metrics"
          file_pattern: "profile/metrics.svg"
